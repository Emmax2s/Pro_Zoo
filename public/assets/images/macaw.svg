<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="featherRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="featherYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="featherBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)" />

  <!-- Tropical Leaf Accents -->
  <path d="M-50,200 Q200,100 350,300 Q150,450 -50,200 Z" fill="url(#leafGrad)" opacity="0.4" />
  <path d="M1250,600 Q950,400 800,650 Q1050,750 1250,600 Z" fill="url(#leafGrad)" opacity="0.3" />
  <path d="M100,-50 Q300,150 150,350 Q-50,200 100,-50 Z" fill="url(#leafGrad)" opacity="0.25" />

  <!-- Branch -->
  <path d="M150,600 Q500,520 1050,560 Q1080,590 1050,620 Q500,580 150,640 Z" fill="#78350f" />

  <!-- Macaw Tail Feathers -->
  <path d="M540,550 Q560,780 580,820 Q550,820 520,560 Z" fill="#dc2626" />
  <path d="M555,550 Q580,790 605,830 Q585,830 545,560 Z" fill="#2563eb" />

  <!-- Body (Red) -->
  <path d="M460,320 Q580,300 580,450 Q560,560 490,560 Q440,520 460,320 Z" fill="url(#featherRed)" />

  <!-- Wing Layers -->
  <!-- Red Upper Wing -->
  <path d="M470,360 Q570,370 550,470 Q480,450 470,360 Z" fill="url(#featherRed)" />
  <!-- Yellow Mid Wing -->
  <path d="M490,410 Q580,420 560,490 Q500,470 490,410 Z" fill="url(#featherYellow)" />
  <!-- Blue Lower Wing -->
  <path d="M500,450 Q600,460 570,540 Q510,510 500,450 Z" fill="url(#featherBlue)" />

  <!-- Head (Red) -->
  <circle cx="480" cy="270" r="65" fill="url(#featherRed)" />

  <!-- White Face Patch -->
  <path d="M440,250 Q495,240 480,295 Q435,290 440,250 Z" fill="#fdf4ff" />

  <!-- Beak -->
  <path d="M435,250 Q380,265 415,310 Q440,295 440,270 Z" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <path d="M420,290 Q400,305 418,318 Q430,308 425,295 Z" fill="#1e293b" />

  <!-- Eye -->
  <circle cx="465" cy="265" r="9" fill="#fbbf24" />
  <circle cx="465" cy="265" r="5" fill="#0f172a" />
  <circle cx="463" cy="263" r="1.5" fill="#ffffff" />

  <!-- Soft Vignette Frame -->
  <rect width="1200" height="800" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="20" />
</svg>
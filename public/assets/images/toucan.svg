<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgToucan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bgToucan)" />

  <!-- Branch -->
  <path d="M100,550 Q600,500 1100,540 L1100,590 Q600,550 100,600 Z" fill="#451a03" />

  <!-- Toucan Body (Black) -->
  <path d="M450,300 Q600,280 620,480 Q600,620 500,600 Q420,550 450,300 Z" fill="#0f172a" />

  <!-- Yellow Chest -->
  <path d="M450,300 Q540,320 530,460 Q460,450 450,300 Z" fill="#fef08a" />

  <!-- Beak -->

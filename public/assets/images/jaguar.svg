<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgJaguar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="60%" stop-color="#052e16" />
      <stop offset="100%" stop-color="#021c0e" />
    </linearGradient>
    <linearGradient id="furGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgJaguar)" />

  <!-- Jungle Leaves -->
  <path d="M-20,100 Q300,50 400,250 Q100,350 -20,100 Z" fill="#15803d" opacity="0.4" />
  <path d="M800,-40 Q1100,100 1250,300 Q950,250 800,-40 Z" fill="#166534" opacity="0.45" />

  <!-- Jaguar Body -->
  <path d="M300,500 Q450,380 700,420 Q880,450 950,560 Q900,680 650,680 Q400,680 300,500 Z" fill="url(#furGrad)" />

  <!-- Head -->
  <circle cx="380" cy="420" r="110" fill="url(#furGrad)" />
  <!-- Ears -->
  <path d="M300,330 Q320,260 360,320 Z" fill="#b45309" />
  <path d="M420,330 Q450,260 470,330 Z" fill="#b45309" />

  <!-- Muzzle -->
  <ellipse cx="360" cy="460" rx="45" ry="35" fill="#fef3c7" />
  <path d="M345,445 Q360,460 375,445 Q360,475 345,445 Z" fill="#451a03" />

  <!-- Eyes -->
  <circle cx="330" cy="400" r="12" fill="#facc15" />
  <circle cx="330" cy="400" r="6" fill="#000000" />
  <circle cx="410" cy="400" r="12" fill="#facc15" />
  <circle cx="410" cy="400" r="6" fill="#000000" />

  <!-- Rosettes / Spots -->
  <g fill="#78350f" opacity="0.85">
    <circle cx="500" cy="460" r="14" />
    <circle cx="550" cy="430" r="18" />
    <circle cx="620" cy="460" r="22" />
    <circle cx="700" cy="470" r="20" />
    <circle cx="780" cy="490" r="24" />
    <circle cx="840" cy="530" r="18" />
    <circle cx="580" cy="520" r="20" />
    <circle cx="660" cy="550" r="25" />
    <circle cx="740" cy="570" r="22" />
    <circle cx="430" cy="490" r="12" />
  </g>
</svg>